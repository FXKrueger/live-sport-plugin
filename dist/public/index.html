<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvio Live Sports</title>
  <link rel="icon" href="/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #09090b; --panel: #121215; --panel-2: #18181c; --border: rgba(255,255,255,0.08); --text: #f4f4f5; --muted: #9ca3af; --accent: #ef4444; --ok: #22c55e; --warn: #f59e0b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
    header { position: sticky; top: 0; z-index: 50; background: rgba(9,9,11,0.85); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .bar { max-width: 1500px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 20px; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .dot.bad { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .spacer { flex: 1; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: default; }
    main { max-width: 1500px; margin: 0 auto; padding: 22px 24px 60px; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; flex: 1; scrollbar-width: thin; }
    .tab { padding: 8px 14px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
    .tab:hover { color: #fff; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tab .n { opacity: .7; font-weight: 500; margin-left: 4px; }
    input.search { padding: 9px 14px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: #fff; outline: none; min-width: 220px; font-family: inherit; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .2s, border-color .2s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-3px); border-color: rgba(239,68,68,0.6); }
    .poster { position: relative; aspect-ratio: 16/9; background: #0c0c0f; overflow: hidden; }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster .logo { position: absolute; left: 10px; top: 10px; width: 40px; height: 40px; border-radius: 10px; background: rgba(0,0,0,0.6); object-fit: contain; padding: 5px; }
    .tag { position: absolute; right: 10px; top: 10px; font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 999px; background: rgba(0,0,0,0.7); }
    .tag.live { background: var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); } 70% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
    .info { padding: 12px 14px 14px; }
    .title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { font-size: 12px; color: var(--muted); line-height: 1.5; white-space: pre-line; }
    .empty { grid-column: 1/-1; color: var(--muted); padding: 40px; text-align: center; }

    /* Player overlay */
    #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); z-index: 100; }
    #overlay.open { display: flex; flex-direction: column; }
    .ov-bar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .ov-bar .t { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ov-body { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
    @media (max-width: 860px) { .ov-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }
    .ov-video { display: flex; align-items: center; justify-content: center; background: #000; position: relative; min-height: 220px; }
    video { width: 100%; height: 100%; max-height: 100%; background: #000; }
    .ov-list { border-left: 1px solid var(--border); overflow: auto; padding: 12px; }
    .ov-list h4 { margin: 4px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .stream { padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid transparent; margin-bottom: 8px; cursor: pointer; font-size: 13px; white-space: pre-line; line-height: 1.45; }
    .stream:hover { border-color: rgba(255,255,255,0.15); }
    .stream.active { border-color: var(--accent); background: rgba(239,68,68,0.1); }
    .stream .k { display: inline-block; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 5px; margin-bottom: 4px; }
    .stream .k.direct { background: rgba(34,197,94,0.15); color: var(--ok); }
    .stream .k.web { background: rgba(156,163,175,0.15); color: var(--muted); }
    .loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 13px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f1f23; border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/"><img src="/logo.png" alt=""> Nuvio Live Sports</a>
    <div class="status" id="status"><span class="dot warn"></span><span>Loading status…</span></div>
    <div class="spacer"></div>
    <button class="btn" id="refreshBtn" title="Re-sync all providers now">⟳ Refresh</button>
    <a class="btn primary" href="/configure">⚙ Configure & Install</a>
  </div>
</header>

<main>
  <div class="controls">
    <div class="tabs" id="tabs"><span class="tab">Loading…</span></div>
    <input class="search" id="search" type="search" placeholder="Search teams, leagues…">
  </div>
  <div class="grid" id="grid"></div>
</main>

<div id="overlay">
  <div class="ov-bar">
    <div class="t" id="ovTitle">Player</div>
    <button class="btn" id="closeBtn">✕ Close</button>
  </div>
  <div class="ov-body">
    <div class="ov-video">
      <div class="loader" id="loader"><div class="spinner"></div><div id="loaderText">Resolving streams…</div></div>
      <video id="video" controls playsinline></video>
    </div>
    <div class="ov-list"><h4>Streams</h4><div id="streamList"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let hls = null, current = [], activeCatalog = null;

  const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); };
  const ago = (ms) => ms == null ? 'never' : ms < 60000 ? `${Math.round(ms / 1000)}s ago` : ms < 3600000 ? `${Math.round(ms / 60000)} min ago` : `${Math.round(ms / 3600000)} h ago`;

  // ── Status bar ─────────────────────────────────────────────────────────────
  async function loadStatus() {
    try {
      const s = await (await fetch('/api/status', { cache: 'no-store' })).json();
      const okProviders = s.sync && s.sync.report ? s.sync.report.providers.filter(p => p.ok).length : 0;
      const total = s.sync && s.sync.report ? s.sync.report.providers.length : 0;
      const cls = s.sync && s.sync.syncing ? 'warn' : (okProviders > 0 ? '' : 'bad');
      $('#status').innerHTML = `<span class="dot ${cls}"></span><span>${s.live} live · ${s.matches} events · ${okProviders}/${total} sources · synced ${ago(s.sync ? s.sync.ageMs : null)}${s.sync && s.sync.syncing ? ' · syncing…' : ''}</span>`;
      $('#status').title = s.sync && s.sync.report ? s.sync.report.providers.map(p => `${p.ok ? '✓' : '✗'} ${p.name}: ${p.count} (${p.ms} ms)`).join('\n') : '';
    } catch (_) {
      $('#status').innerHTML = '<span class="dot bad"></span><span>Server unreachable</span>';
    }
  }

  $('#refreshBtn').addEventListener('click', async () => {
    const b = $('#refreshBtn'); b.disabled = true; b.textContent = '⟳ Refreshing…';
    try {
      const r = await (await fetch('/api/refresh', { method: 'POST' })).json();
      if (r.started) toast(`Refreshed · ${r.matches} events`);
      else if (r.reason === 'rate-limited') toast(`Please wait ${Math.ceil((r.waitMs || 0) / 1000)}s before refreshing again`);
      else toast('A refresh is already running');
      await loadStatus();
      if (activeCatalog) await loadCatalog(activeCatalog.id, activeCatalog.el, true);
    } catch (e) { toast('Refresh failed'); }
    b.disabled = false; b.textContent = '⟳ Refresh';
  });

  // ── Tabs ───────────────────────────────────────────────────────────────────
  async function loadTabs() {
    try {
      const manifest = await (await fetch('/manifest.json')).json();
      const tabs = $('#tabs'); tabs.innerHTML = '';
      let first = null;
      manifest.catalogs.forEach(c => {
        if (c.type !== 'tv' || c.id === 'nuvio_sports_teams') return;
        const el = document.createElement('button');
        el.className = 'tab'; el.textContent = c.name;
        el.onclick = () => loadCatalog(c.id, el);
        tabs.appendChild(el);
        if (!first) first = { id: c.id, el };
      });
      if (first) loadCatalog(first.id, first.el);
    } catch (e) {
      $('#tabs').innerHTML = '<span class="tab">Failed to load manifest</span>';
    }
  }

  async function loadCatalog(id, el, silent) {
    activeCatalog = { id, el };
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    if (!silent) { $('#grid').innerHTML = '<div class="empty">Loading…</div>'; $('#search').value = ''; }
    try {
      const data = await (await fetch(`/catalog/tv/${id}.json`, { cache: 'no-store' })).json();
      current = data.metas || [];
      render(filter(current, $('#search').value));
    } catch (e) {
      $('#grid').innerHTML = '<div class="empty">Failed to load catalog.</div>';
    }
  }

  const filter = (metas, q) => {
    q = (q || '').toLowerCase().trim();
    if (!q) return metas;
    return metas.filter(m => m.name.toLowerCase().includes(q) || (m.description || '').toLowerCase().includes(q) || (m.cast || []).some(c => c.toLowerCase().includes(q)));
  };
  $('#search').addEventListener('input', (e) => render(filter(current, e.target.value)));

  function render(metas) {
    const grid = $('#grid'); grid.innerHTML = '';
    if (!metas.length) { grid.innerHTML = '<div class="empty">Nothing here right now. Try another tab or hit Refresh.</div>'; return; }
    const frag = document.createDocumentFragment();
    metas.forEach(m => {
      const isLive = m.releaseInfo === 'LIVE';
      const is247 = m.releaseInfo === '24/7';
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openMatch(m);
      card.innerHTML = `
        <div class="poster">
          <img src="${m.poster}" loading="lazy" alt="">
          ${m.logo && m.logo !== m.poster ? `<img class="logo" src="${m.logo}" alt="">` : ''}
          <span class="tag ${isLive ? 'live' : ''}">${isLive ? '● LIVE' : (is247 ? '24/7' : m.releaseInfo || 'Upcoming')}</span>
        </div>
        <div class="info">
          <div class="title">${m.name.replace(/^(🔴|📺)\s*/, '')}</div>
          <div class="meta">${(m.description || '')}</div>
        </div>`;
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  }

  // ── Player ─────────────────────────────────────────────────────────────────
  const overlay = $('#overlay'), video = $('#video'), loader = $('#loader');
  function showLoader(text) { loader.style.display = 'flex'; $('#loaderText').textContent = text; }
  function hideLoader() { loader.style.display = 'none'; }

  let openToken = 0;
  async function openMatch(m) {
    const token = ++openToken;
    overlay.classList.add('open');
    $('#ovTitle').textContent = m.name;
    $('#streamList').innerHTML = '';
    showLoader('Resolving streams…');
    const seen = new Set();
    let autoPlayed = false;
    let attempts = 0;
    const list = $('#streamList');
    const note = document.createElement('div');
    note.className = 'meta'; note.style.padding = '4px 2px 10px';
    list.appendChild(note);

    while (token === openToken && attempts < 5) {
      attempts++;
      let data;
      try { data = await (await fetch(`/stream/tv/${m.id}.json`, { cache: 'no-store' })).json(); }
      catch (e) { showLoader('Failed to resolve streams.'); return; }
      const streams = data.streams || [];
      streams.forEach((s) => {
        const key = s.url || s.externalUrl || s.title;
        if (seen.has(key)) return;
        seen.add(key);
        const el = document.createElement('div');
        el.className = 'stream';
        const direct = !!s.url;
        el.innerHTML = `<span class="k ${direct ? 'direct' : 'web'}">${direct ? 'DIRECT' : 'BROWSER'}</span>\n${s.title || s.name}`;
        el.onclick = () => play(s, el);
        list.appendChild(el);
        if (!autoPlayed && direct) { autoPlayed = true; play(s, el); }
      });
      if (!data.partial) { note.textContent = seen.size ? `${seen.size} stream${seen.size === 1 ? '' : 's'}` : ''; break; }
      note.textContent = `${seen.size} ready · more sources still resolving…`;
      if (!autoPlayed) showLoader(seen.size ? 'Only browser streams so far. Waiting for direct sources…' : 'Still resolving sources…');
      await new Promise(r => setTimeout(r, 4000));
    }
    if (token !== openToken) return;
    if (!seen.size) showLoader('No streams available right now. Try again in a minute.');
    else if (!autoPlayed) showLoader('Only browser streams available. Pick one on the right.');
  }

  function play(s, el) {
    document.querySelectorAll('.stream').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    if (!s.url) { window.open(s.externalUrl, '_blank', 'noopener'); return; }
    showLoader('Loading stream…');
    if (hls) { hls.destroy(); hls = null; }
    if (Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, lowLatencyMode: true });
      hls.loadSource(s.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { hideLoader(); video.play().catch(() => {}); });
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showLoader('Stream failed. Pick another source.'); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = s.url; video.addEventListener('loadedmetadata', () => { hideLoader(); video.play().catch(() => {}); }, { once: true });
    } else {
      showLoader('This browser cannot play HLS.');
    }
  }

  function closePlayer() {
    openToken++;
    overlay.classList.remove('open');
    video.pause(); video.removeAttribute('src'); video.load();
    if (hls) { hls.destroy(); hls = null; }
  }
  $('#closeBtn').addEventListener('click', closePlayer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.classList.contains('open')) closePlayer(); });

  loadStatus(); loadTabs();
  setInterval(loadStatus, 30000);
  setInterval(() => { if (activeCatalog && !overlay.classList.contains('open')) loadCatalog(activeCatalog.id, activeCatalog.el, true); }, 120000);
})();
</script>
</body>
</html>
