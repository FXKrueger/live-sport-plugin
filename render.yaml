# Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml
#
# Node runtime (matches the existing service). `npm run build` bundles src/ into
# dist/ so the deployed code always matches the repo. A Dockerfile is also
# provided for Docker-based hosts.

services:
  - type: web
    name: nuvio-live-sports
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Full provider re-sync schedule with zero traffic (cron syntax)
      - key: CATALOG_SYNC_CRON
        value: "*/10 * * * *"
      # Traffic-driven stale-while-revalidate window (ms)
      - key: CATALOG_REVALIDATE_MS
        value: 180000
      # Keep segment relay OFF on Render (Cloudflare edge challenges players)
      - key: RELAY_SEGMENTS
        value: "false"
      # Fewer concurrent prewarms on the 512 MB free instance
      - key: PREWARM_MAX
        value: 4
